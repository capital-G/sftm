<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta name="description" content="Logic and algebra puzzle games." />
    <link type="image/png" rel="icon" href="icon.png">
    <title>Sympathy for the Machine</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: LightSlateGrey;
            color: White;
            font-family: serif;
            font-size: 110%;
        }

        main {
            box-sizing: border-box;
            width: 100%;
            max-width: 512px;
            min-height: 100vh;
            padding: 0 24px;
            background: #264040;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 150%;
            font-weight: normal;
        }

        .editions {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .edition {
            display: block;
            color: White;
            text-decoration: none;
        }

        .edition-button {
            display: inline-block;
            border: solid 1px White;
            border-radius: 6px;
            padding: 6px 12px;
            font-family: sans-serif;
            font-size: 91%;
        }

        .edition:hover .edition-button,
        .edition:focus .edition-button {
            background: #1a2c2c;
        }

        .edition-text {
            margin-top: 10px;
            font-size: 80%;
            color: #cfcfcf;
        }

        .hint {
            margin-top: 48px;
            font-size: 85%;
        }

        @media (max-device-width: 480px) {
            .hint {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main>
        <h1>Sympathy for the Machine</h1>

        <div class="editions">
            <a class="edition" href="classic/">
                <span class="edition-button">Logic</span>
                <div class="edition-text">The classic edition: 37 problems in propositional logic.</div>
            </a>
            <a class="edition" href="algebra/">
                <span class="edition-button">Algebra</span>
                <div class="edition-text">A tactical approach to algebraic problem solving: 55 problems.</div>
            </a>
        </div>

        <div class="hint">Best viewed on a cell phone.</div>
    </main>

</body>

</html>
